name: free_dextop
description: Área de Trabalho Móvel — transforme seu Android em um ambiente de desktop flexível (fork em pt-BR do Dextop).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  in_app_update: ^4.2.5
  archive: ^4.0.7
  file_picker: ^10.3.3
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/dextop_icon.png
    - assets/setup_tutorial/
